<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Upload Ảnh Đại Diện</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #333;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      width: 400px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h2 {
      margin-top: 10px;
      color: #2b3a67;
      font-size: 20px;
    }

    form {
      margin: 20px 0;
    }

    input[type="file"] {
      display: block;
      margin: 10px auto;
      border: 1px solid #ccc;
      padding: 8px;
      border-radius: 6px;
      width: 80%;
    }

    button {
      background: linear-gradient(90deg, #6C63FF, #3F37C9);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(90deg, #3F37C9, #6C63FF);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(63, 55, 201, 0.3);
    }

    .preview {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #eee;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Upload 1 Ảnh Đại Diện</h2>
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="avatar" id="avatarInput" accept="image/*" required>
      <div class="preview" id="avatarPreview"></div>
      <button type="submit">Upload</button>
    </form>

    <hr style="margin: 25px 0; border: none; height: 1px; background: #ddd;">

    <h2>Upload Nhiều Ảnh</h2>
    <form id="multiForm" enctype="multipart/form-data">
      <input type="file" name="images" id="multiInput" multiple accept="image/*">
      <div class="preview" id="multiPreview"></div>
      <button type="submit">Upload Nhiều Ảnh</button>
    </form>
  </div>

  <script>
    const token = localStorage.getItem('token'); // token lưu sau khi đăng nhập

    // 🧩 Preview ảnh đơn
    document.getElementById('avatarInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const preview = document.getElementById('avatarPreview');
      preview.innerHTML = '';
      if (file) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      }
    });

    // 🧩 Preview nhiều ảnh
    document.getElementById('multiInput').addEventListener('change', (e) => {
      const files = e.target.files;
      const preview = document.getElementById('multiPreview');
      preview.innerHTML = '';
      Array.from(files).forEach(f => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        preview.appendChild(img);
      });
    });

    // 🧩 Upload 1 ảnh
document.getElementById('uploadForm').onsubmit = async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const res = await fetch('http://localhost:3000/users/upload-avatar', { // ✅ sửa /user -> /users
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}` },
    body: formData
  });
  const data = await res.json();
  alert(data.message || 'Upload thành công!');
};

// 🧩 Upload nhiều ảnh
document.getElementById('multiForm').onsubmit = async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const res = await fetch('http://localhost:3000/users/upload-multi', { // ✅ sửa /user -> /users
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}` },
    body: formData
  });
  const data = await res.json();
  alert(data.message || 'Upload nhiều ảnh thành công!');
};

  </script>
</body>
</html>
